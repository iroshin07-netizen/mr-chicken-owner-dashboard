name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --no-package-lock

      - name: Build React App (For Android)
        run: npx vite build --base=/

      - name: Setup Capacitor (Web to Native)
        run: |
          npm install @capacitor/core @capacitor/android --no-package-lock
          npm install -D @capacitor/cli --no-package-lock
          npx cap init "Owner Dashboard" "com.mrchicken.ownerdashboard" --web-dir dist

      - name: Add Android Platform
        run: npx cap add android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Fix Kotlin Clash & Build APK
        run: |
          cd android
          # Khala ke ladke (duplicate packages) ko bahar nikalne ka code
          cat <<EOF >> app/build.gradle
          
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF
          
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload The APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Mr-Chicken-Owner-Dashboard-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
